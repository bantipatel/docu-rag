spring.application.name=docu-rag
server.port=8080

# H2 Configuration
spring.datasource.url=jdbc:h2:mem:ragdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Ingest config
ingest.chunk-size=500
ingest.chunk-overlap=50

# Search config
search.vector-weight=0.6
search.bm25-weight=0.4
search.confidence-threshold=0.3

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
